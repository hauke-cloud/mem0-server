---
name: CI/CD

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.13"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Build, Test, and Release
        uses: hauke-cloud/inpacken-un-af-dor-mit@v1
        with:
          # Language
          language: "python"
          language-version: ${{ env.PYTHON_VERSION }}

          # Container Build
          dockerfile-path: "./Dockerfile"
          docker-context: "."
          platforms: "linux/amd64,linux/arm64"

          # Registry
          registry: "ghcr.io"
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ github.repository }}
          # Branch builds publish the chart as 0.0.0-dev-<sha> and point its
          # image at that same tag, which the action's default tag set does
          # not produce (it only emits sha-<sha>). Push it so the chart pulls.
          additional-tags: |
            type=raw,value=0.0.0-dev-{{sha}},enable=${{ !startsWith(github.ref, 'refs/tags/') }}

          # Helm
          enable-helm: "true"
          helm-chart-path: "./deployment/helm"
          helm-chart-name: "mem0-server"

          # Testing
          run-tests: "true"
          test-command: "make test"
          enable-coverage: "false"

          # Linting. The action splices `lint-command` verbatim into an
          # `if [ -n "..." ]` test before running it, so anything with quotes
          # or a `$(...)` in it breaks there. Hence a bare `make` target, which
          # also keeps CI and a local `make ci-lint` running the same checks --
          # including the chart lint/render, for which the action has no step
          # of its own. helm comes preinstalled on ubuntu-latest; the action's
          # own setup-helm step only runs later, for packaging.
          run-lint: "true"
          lint-command: "make ci-lint"

          # Build Arguments
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}

          # Release
          enable-release: "true"
          release-draft: "false"
