# NOTE: CI rewrites every line containing "tag" followed by a colon in this
# file to the release version, so that key must only appear under `image`.

# One replica only: mem0 keeps each memory's change history in a SQLite file
# on the persistence volume below, which cannot be shared between pods.
replicaCount: 1

image:
  repository: ghcr.io/hauke-cloud/mem0-server
  pullPolicy: IfNotPresent
  # Overrides the image version, which defaults to the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Who may call the API, and which user their memories belong to. Every request
# needs an access token from `issuer` naming one of `audiences`; the token's
# `userIdClaim` becomes the mem0 user_id, and a caller never sees or changes
# another user's memories.
oidc:
  # e.g. https://id.example.com/realms/cloud
  issuer: ""
  # Accepted `aud` values. Keycloak only sets `aud` through an audience mapper
  # on the client the token was issued to.
  audiences: []
  # Empty: read from <issuer>/.well-known/openid-configuration.
  jwksUrl: ""
  # `sub` is stable for the life of the account. `preferred_username` reads
  # better in the database but moves a user's memories out of reach on rename.
  userIdClaim: sub
  # Any one of these roles lets a token in; empty lets every valid token in.
  requiredRoles: []
  # Dotted path to the roles array: `roles` for a Keycloak "User Realm Role"
  # mapper with that claim name, `realm_access.roles` for Keycloak's default.
  rolesClaim: roles

mem0:
  # OpenAI-compatible chat endpoint mem0 uses to extract and merge facts.
  llm:
    baseUrl: ""
    model: ""
    temperature: 0.1
    maxTokens: 2000
  # OpenAI-compatible embeddings endpoint.
  embedder:
    baseUrl: ""
    model: ""
    # Must match the model's output size. Changing it later needs a new
    # collectionName (or a dropped table): pgvector fixes the column size.
    dims: 1024
  # Table in the database the connection string points at.
  collectionName: memories
  # Deep-merged over the generated mem0 config (Memory.from_config), for
  # settings this chart has no value for, e.g. custom_instructions or a
  # reranker. Rendered to a ConfigMap as JSON.
  extraConfig: {}

postgres:
  # libpq connection string. The database needs the pgvector extension
  # created by a superuser beforehand; mem0 only runs CREATE EXTENSION IF NOT
  # EXISTS, which succeeds unprivileged once it exists. With clientCert below,
  # e.g.:
  #   postgresql://mem0@db:5432/mem0?sslmode=verify-full&sslrootcert=/etc/ssl/db/ca.crt&sslcert=/etc/ssl/db/tls.crt&sslkey=/etc/ssl/db/tls.key
  # Leave empty to take PG_CONNECTION_STRING from existingSecret instead (e.g.
  # when it contains a password).
  connectionString: ""
  # kubernetes.io/tls Secret (ca.crt, tls.crt, tls.key) mounted at
  # /etc/ssl/db, e.g. from a cert-manager Certificate, for client certificate
  # authentication. The key is mounted 0400, which libpq insists on.
  clientCertSecret: ""

# Secret with further environment variables, e.g. PG_CONNECTION_STRING,
# MEM0_LLM_API_KEY, MEM0_EMBEDDER_API_KEY. All keys are imported.
existingSecret: ""

# Additional environment variables (list of corev1.EnvVar).
extraEnv: []

# Holds mem0's SQLite history database (/data/history.db): the previous
# versions of every memory, served by /memories/{id}/history. Without
# persistence it lives in an emptyDir and is lost on every restart; the
# memories themselves are in Postgres either way.
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi

logLevel: info

extraVolumes: []
extraVolumeMounts: []

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8000
  annotations: {}

containerPort: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: mem0.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Gateway API counterpart of `ingress` above. TLS is terminated on the
# Gateway listener, not per route.
httpRoute:
  # -- Expose the service through a Gateway API HTTPRoute.
  enabled: false
  # -- Annotations for the HTTPRoute.
  annotations: {}
  # -- Extra labels for the HTTPRoute.
  labels: {}
  # -- Gateways this route attaches to.
  parentRefs:
    - name: hauke-cloud
      namespace: envoy-gateway
  # -- Hostnames served by this route.
  hostnames:
    - mem0.example.com
  # Adding a memory waits for an LLM extraction pass, which behind a model
  # swapper includes loading the model, far past Envoy's 15s default.
  # -- Per-request timeouts.
  timeouts:
    request: 300s
    backendRequest: 300s
  # -- Route rules. Empty emits one rule matching everything under `/`.
  rules: []

# Envoy Gateway policies (gateway.envoyproxy.io/v1alpha1) attached to the
# HTTPRoute above. Each renders `spec` verbatim and fills in targetRefs; both
# require httpRoute.enabled. The service verifies tokens itself, so a
# SecurityPolicy is defence in depth (and keeps anonymous traffic off the pod),
# not a requirement.
envoyGateway:
  securityPolicy:
    # -- Render a SecurityPolicy for the HTTPRoute.
    enabled: false
    annotations: {}
    # -- SecurityPolicy spec without targetRefs.
    spec: {}
    #  jwt:
    #    providers:
    #      - name: keycloak
    #        issuer: https://id.example.com/realms/cloud
    #        audiences: [mem0]
    #        remoteJWKS:
    #          uri: https://id.example.com/realms/cloud/protocol/openid-connect/certs
  backendTrafficPolicy:
    # -- Render a BackendTrafficPolicy for the HTTPRoute.
    enabled: false
    annotations: {}
    # -- BackendTrafficPolicy spec without targetRefs.
    spec: {}

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 1Gi

# Neither probe touches Postgres, the LLM or the embedder: behind llama-swap a
# probe that reached a model would load it, and evict whatever was running.
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
