{{- if .Values.envoyGateway.backendTrafficPolicy.enabled }}
{{- if not .Values.httpRoute.enabled }}
{{- fail "mem0-server: envoyGateway.backendTrafficPolicy requires httpRoute.enabled" }}
{{- end }}
{{- if not .Values.envoyGateway.backendTrafficPolicy.spec }}
{{- fail "mem0-server: envoyGateway.backendTrafficPolicy.spec must not be empty" }}
{{- end }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "mem0-server.fullname" . }}
  labels:
    {{- include "mem0-server.labels" . | nindent 4 }}
  {{- with .Values.envoyGateway.backendTrafficPolicy.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  targetRefs:
    {{- include "mem0-server.httpRouteTargetRef" . | nindent 4 }}
  {{- toYaml .Values.envoyGateway.backendTrafficPolicy.spec | nindent 2 }}
{{- end }}
